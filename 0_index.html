<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Files</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#1c1f26;
    --panel:#242833;
    --line:#333846;
    --text:#e8eaf0;
    --muted:#8b93a7;
    --accent:#5fb3ce;
    --folder:#e8b25f;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:ui-monospace, "SF Mono", Consolas, "Liberation Mono", monospace;
    font-size:14px;
    line-height:1.5;
  }
  header{
    padding:28px 32px 18px;
    border-bottom:1px solid var(--line);
  }
  header h1{
    margin:0 0 6px;
    font-size:18px;
    font-weight:600;
    letter-spacing:.2px;
  }
  #breadcrumb{
    color:var(--muted);
    font-size:13px;
  }
  #breadcrumb a{
    color:var(--accent);
    text-decoration:none;
  }
  #breadcrumb a:hover{text-decoration:underline}
  #breadcrumb .sep{margin:0 6px;color:var(--line)}
  main{
    max-width:820px;
    margin:0 auto;
    padding:16px 32px 60px;
  }
  ul{
    list-style:none;
    margin:0;
    padding:0;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:var(--panel);
  }
  li{
    border-bottom:1px solid var(--line);
  }
  li:last-child{border-bottom:none}
  li a{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    color:var(--text);
    text-decoration:none;
  }
  li a:hover{background:#2c313e}
  .icon{
    width:18px;
    text-align:center;
    flex-shrink:0;
  }
  .icon.folder{color:var(--folder)}
  .icon.file{color:var(--muted)}
  .name{flex:1; word-break:break-all;}
  .size{
    color:var(--muted);
    font-size:12px;
    flex-shrink:0;
  }
  #status{
    color:var(--muted);
    padding:20px 0;
  }
  #status.error{color:#e07a7a}
  a.dir-name{font-weight:500}
</style>
</head>
<body>

<header>
  <h1>Team Files</h1>
  <div id="breadcrumb"></div>
</header>

<main>
  <div id="status">Loading…</div>
  <ul id="listing" style="display:none"></ul>
</main>

<script>
/* ====== EDIT THESE THREE VALUES FOR YOUR REPO ====== */
const OWNER  = "tsar2026";   // your GitHub username
const REPO   = "horses";        // your repository name
const BRANCH = "main";           // branch to read from
/* ==================================================== */

const params = new URLSearchParams(location.search);
const currentPath = params.get("path") || "";

const listingEl = document.getElementById("listing");
const statusEl = document.getElementById("status");
const crumbEl = document.getElementById("breadcrumb");

function humanSize(bytes){
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/(1024*1024)).toFixed(1) + " MB";
}

function buildBreadcrumb(path){
  const parts = path ? path.split("/") : [];
  let html = `<a href="?path=">${REPO}</a>`;
  let acc = "";
  parts.forEach(part => {
    acc += (acc ? "/" : "") + part;
    html += `<span class="sep">/</span><a href="?path=${encodeURIComponent(acc)}">${part}</a>`;
  });
  crumbEl.innerHTML = html;
}

async function loadListing(path){
  buildBreadcrumb(path);
  const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;

  try {
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
    const items = await res.json();

    if (!Array.isArray(items)) throw new Error("Not a folder");

    items.sort((a,b) => {
      if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
      return a.name.localeCompare(b.name);
    });

    if (items.length === 0){
      statusEl.textContent = "This folder is empty.";
      statusEl.className = "";
      listingEl.style.display = "none";
      return;
    }

    listingEl.innerHTML = items.map(item => {
      if (item.type === "dir"){
        const newPath = path ? `${path}/${item.name}` : item.name;
        return `<li><a href="?path=${encodeURIComponent(newPath)}">
          <span class="icon folder">▸</span>
          <span class="name dir-name">${item.name}/</span>
        </a></li>`;
      } else {
        return `<li><a href="${item.download_url}" target="_blank" rel="noopener">
          <span class="icon file">•</span>
          <span class="name">${item.name}</span>
          <span class="size">${humanSize(item.size)}</span>
        </a></li>`;
      }
    }).join("");

    statusEl.style.display = "none";
    listingEl.style.display = "block";
  } catch (err){
    statusEl.textContent = `Couldn't load this folder (${err.message}). Check that OWNER/REPO/BRANCH are set correctly at the top of the script, and that the repo is public.`;
    statusEl.className = "error";
    listingEl.style.display = "none";
  }
}

loadListing(currentPath);
</script>

</body>
</html>
